<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名古屋五日旅</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
:root{--bg:#f4f9f8;--card:#fff;--ink:#21403c;--mute:#7a948f;--g:#3fb0a0;--gd:#2a8f82;--gl:#e1f3f0;--line:#e3eeec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a19;--card:#162726;--ink:#e3f2ef;--mute:#8aa8a3;--gl:#1d3633;--line:#233a37}}
:root[data-theme="dark"]{--bg:#0e1a19;--card:#162726;--ink:#e3f2ef;--mute:#8aa8a3;--gl:#1d3633;--line:#233a37}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
.hd{background:linear-gradient(160deg,#5cc4b4,#2a8f82);color:#fff;border-radius:0 0 32px 32px}
.strip{scrollbar-width:none;scroll-snap-type:x mandatory}.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:20px;background:rgba(255,255,255,.16);scroll-snap-align:start;transition:.2s}
.day.on{background:#fff;color:var(--gd);box-shadow:0 6px 16px rgba(0,60,50,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 2px 10px rgba(30,90,80,.05)}
.mute{color:var(--mute)}.tm{font-weight:600;color:var(--gd);background:var(--gl);border-radius:12px;padding:4px 0;font-size:14px}
.btn{background:var(--gl);color:var(--gd);border-radius:999px;padding:6px 12px;font-size:12px}
.btn2{color:var(--mute);border-radius:999px;padding:6px 8px;font-size:12px}
.pri{background:var(--g);color:#fff;border-radius:18px;padding:12px;font-weight:600;width:100%}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);outline:none}
.inp:focus{border-color:var(--g)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:20}
nav.tabs button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--mute)}nav.tabs button.on{color:var(--gd);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(10,30,28,.45);z-index:30;display:flex;align-items:flex-end}
</style>
</head>
<body>
<div id="app" class="max-w-md mx-auto pb-28">
  <header class="hd px-5 pt-6 pb-4">
    <div class="flex justify-between items-end">
      <div><p class="text-xs tracking-widest opacity-80">NAGOYA 2026</p><h1 class="text-2xl font-semibold">名古屋 五日旅</h1></div>
      <p class="text-xs opacity-80">10/30 – 11/3</p>
    </div>
    <div class="strip mt-4 flex gap-2 overflow-x-auto">
      <button v-for="(d,i) in days" :key="d.d" @click="sel=i" :class="['day',sel===i&&'on']">
        <span class="text-[11px]">週{{d.w}}</span><b class="text-lg">{{d.l}}</b><span class="text-[11px]">{{dayWx(d)}}</span>
      </button>
    </div>
  </header>

  <main class="px-4 mt-4 space-y-3">
    <!-- 行程 -->
    <template v-if="tab==='plan'">
      <p v-if="!live" class="text-[11px] mute px-1">☁️ 無法連線取得即時預報,顯示當季平均氣溫。</p>
      <article v-for="s in list" :key="s.id" class="card p-4 flex gap-3">
        <div class="w-14 shrink-0 text-center"><div class="tm">{{s.t}}</div><div class="text-[11px] mute mt-1">{{wxAt(s.t)}}</div></div>
        <div class="flex-1 min-w-0">
          <h3 class="font-semibold leading-snug">{{s.n}}</h3>
          <p v-if="s.d" class="text-sm mute mt-1">{{s.d}}</p>
          <div class="flex flex-wrap gap-1 mt-3">
            <template v-if="s.q"><a class="btn" :href="nav(s)" target="_blank" rel="noopener">📍 在地圖開啟</a></template>
            <button class="btn2" @click="openEdit(s)">編輯</button><button class="btn2" @click="del(s)">刪除</button>
          </div>
        </div>
      </article>
      <p v-if="!list.length" class="text-center mute py-10 text-sm">這天還沒有行程</p>
      <button class="pri" @click="openEdit()">＋ 新增行程</button>
    </template>

    <!-- 分帳 -->
    <template v-if="tab==='split'">
      <section class="card p-4">
        <h2 class="font-semibold mb-3">旅伴</h2>
        <div class="flex flex-wrap gap-2">
          <span v-for="(m,i) in members" :key="i" class="flex items-center gap-1 btn">
            <input v-model="members[i]" class="bg-transparent w-16 outline-none text-center">
            <button v-if="members.length>2" @click="rmMember(i)">×</button>
          </span>
          <button class="btn" @click="members.push('旅伴'+(members.length+1))">＋</button>
        </div>
      </section>
      <section class="card p-4 space-y-3">
        <h2 class="font-semibold">新增花費</h2>
        <input class="inp" v-model="ex.title" placeholder="項目(例:晚餐)">
        <div class="flex gap-2">
          <input class="inp" type="number" inputmode="numeric" v-model.number="ex.amt" placeholder="金額 ¥">
          <select class="inp" v-model.number="ex.payer"><option v-for="(m,i) in members" :value="i">{{m}} 付</option></select>
        </div>
        <div class="flex flex-wrap gap-2 text-sm"><span class="mute">分攤:</span>
          <label v-for="(m,i) in members" :key="i" class="flex items-center gap-1"><input type="checkbox" :value="i" v-model="ex.part">{{m}}</label>
        </div>
        <button class="pri" @click="addEx">加入</button>
      </section>
      <section v-if="expenses.length" class="card p-4">
        <h2 class="font-semibold mb-2">花費紀錄</h2>
        <div v-for="e in expenses" :key="e.id" class="flex justify-between items-center py-2 border-b last:border-0" style="border-color:var(--line)">
          <div><p class="text-sm">{{e.title}}</p><p class="text-[11px] mute">{{members[e.payer]}} 付 · {{e.part.length}} 人分</p></div>
          <div class="flex items-center gap-2"><b>¥{{e.amt.toLocaleString()}}</b><button class="btn2" @click="expenses.splice(expenses.indexOf(e),1)">×</button></div>
        </div>
      </section>
      <section class="card p-4" style="background:var(--gl)">
        <h2 class="font-semibold mb-2">結算</h2>
        <p v-if="!pay.length" class="text-sm mute">目前不用互相轉帳 🎉</p>
        <p v-for="(p,i) in pay" :key="i" class="py-1"><b>{{p.from}}</b> → <b>{{p.to}}</b>:<span style="color:var(--gd)" class="font-semibold"> ¥{{p.amt.toLocaleString()}}</span></p>
      </section>
    </template>

    <!-- 地圖 -->
    <template v-if="tab==='map'">
      <section class="card p-4">
        <h2 class="font-semibold">{{days[sel].l}} 路線</h2>
        <p class="text-xs mute mt-1 mb-3">依時間順序在 Google Maps 開啟步行路線(最多 9 個停靠點)。</p>
        <a v-if="route" class="pri block text-center" :href="route" target="_blank" rel="noopener">🗺️ 開啟當日步行路線</a>
        <p v-else class="text-sm mute">需要至少兩個有地點的行程。</p>
      </section>
      <a v-for="(s,i) in mapped" :key="s.id" class="card p-4 flex items-center gap-3 block" :href="nav(s)" target="_blank" rel="noopener">
        <span class="tm w-8 text-center">{{i+1}}</span><div class="flex-1"><p class="font-semibold text-sm">{{s.n}}</p><p class="text-[11px] mute">{{s.t}} · 點擊開啟 Google Maps</p></div><span class="mute">›</span>
      </a>
    </template>
  </main>

  <nav class="tabs flex max-w-md mx-auto">
    <button :class="tab==='plan'&&'on'" @click="tab='plan'"><div class="text-lg">📅</div>行程</button>
    <button :class="tab==='split'&&'on'" @click="tab='split'"><div class="text-lg">💴</div>分帳</button>
    <button :class="tab==='map'&&'on'" @click="tab='map'"><div class="text-lg">🗺️</div>地圖</button>
  </nav>

  <div v-if="form" class="sheet" @click.self="form=null">
    <div class="card w-full max-w-md mx-auto p-5 space-y-3" style="border-radius:28px 28px 0 0">
      <h2 class="font-semibold">{{form.id?'編輯行程':'新增行程'}}</h2>
      <div class="flex gap-2"><input class="inp" type="time" v-model="form.t"><input class="inp" v-model="form.n" placeholder="名稱"></div>
      <input class="inp" v-model="form.q" placeholder="地點(用於導航,可留空)">
      <input class="inp" v-model="form.d" placeholder="備註">
      <div class="flex gap-2"><button class="btn2 flex-1" @click="form=null">取消</button><button class="pri" @click="save">儲存</button></div>
    </div>
  </div>
</div>

<script>
const {createApp,ref,reactive,computed,watch,onMounted}=Vue;
const days=[['2026-10-30','五','10/30'],['2026-10-31','六','10/31'],['2026-11-01','日','11/1'],['2026-11-02','一','11/2'],['2026-11-03','二','11/3']].map(a=>({d:a[0],w:a[1],l:a[2]}));
const id=()=>Math.random().toString(36).slice(2);
const S=(t,n,q,d='')=>({id:id(),t,n,q,d});
const seed=()=>({
'2026-10-30':[S('06:25','抵達中部國際機場','Chubu Centrair International Airport','今天仍是舊制,店內可直接免稅'),S('07:40','名鐵 μ-Sky → 名鐵名古屋','Meitetsu Nagoya Station','約 30 分鐘'),S('08:30','Tsubame Pan & Milk 名驛店','Tsubame Pan and Milk Meieki','吐司、軟冰淇淋;營業時間請先確認'),S('09:45','寄放行李(飯店 / ecbo cloak)','2-10-12 Nishiki Naka-ku Nagoya','伏見站步行約 6–8 分'),S('11:00','大須商店街','Osu Shopping Street Nagoya','上前津站步行;邊逛邊吃午餐'),S('15:00','榮商圈逛街','ラシック 名古屋','松坂屋、三越、PARCO、SUNSHINE SAKAE;藥妝採買'),S('17:30','中部電力 MIRAI TOWER','中部電力 MIRAI TOWER','黃昏上塔看夜景'),S('19:00','世界の山ちゃん','世界の山ちゃん 栄 名古屋','胡椒手羽先;用 okie 翻譯菜單')],
'2026-10-31':[S('09:00','名古屋城','Nagoya Castle','市役所站 7 號出口;天守閣整修中,可看本丸御殿'),S('12:00','金鯱橫丁午餐','Kinshachi Yokocho Nagoya','名古屋めし'),S('14:30','久屋大通公園散步','Hisaya-odori Park Nagoya',''),S('16:00','台中夜市(開幕日)','EDION Hisaya Hiroba Nagoya','12:00–21:00,矢場町站 2/5/6 號出口'),S('19:00','活魚料理 食堂','活魚料理 食堂 名古屋','位置待確認')],
'2026-11-02':[S('07:30','白川鄉一日遊(已訂包車)','Shirakawa-go Gassho-zukuri Village','週一;回程晚可用 GO 叫車'),S('20:30','超商宵夜','Lawson Nishiki Nagoya','')],
'2026-11-01':[S('09:00','名鐵名古屋 → 犬山','Inuyama Station','犬山線約 30 分鐘'),S('10:00','犬山城 + 城下町','Inuyama Castle','國寶天守;城下町小吃當午餐'),S('14:30','熱田神宮','Atsuta Shrine','名鐵神宮前站步行;宮きしめん'),S('18:00','台中夜市','EDION Hisaya Hiroba Nagoya','到 21:00')],
'2026-11-03':[S('10:00','退房 · 寄放行李','2-10-12 Nishiki Naka-ku Nagoya','ecbo cloak 或飯店櫃台'),S('10:30','榮最後採買','Matsuzakaya Nagoya','今天起先付含稅價,機場退稅'),S('13:00','台中夜市(最終日)','EDION Hisaya Hiroba Nagoya','到 20:00'),S('15:30','名古屋站伴手禮','JR Nagoya Takashimaya','ぴよりん、外郎、蝦餅'),S('17:30','取行李','Nagoya Station',''),S('18:15','名鐵 μ-Sky 往機場','Chubu Centrair International Airport','約 30 分鐘'),S('19:30','退稅查驗 + 報到','Chubu Centrair International Airport','22:55 起飛;先過退稅機台')]
});
const avg={'2026-10-30':[11,20],'2026-10-31':[11,20],'2026-11-01':[10,19],'2026-11-02':[10,19],'2026-11-03':[10,19]};
const icon=c=>c==null?'🌤':c===0?'☀️':c<3?'🌤':c===3?'☁️':c<50?'🌫':c<70?'🌧':c<80?'❄️':c<90?'🌦':'⛈';
createApp({setup(){
  let saved={};try{saved=JSON.parse(localStorage.getItem('ngy26b')||'{}')}catch(e){}
  const sel=ref(0),tab=ref('plan'),form=ref(null),live=ref(false);
  const stops=reactive(saved.stops||seed());
  const members=reactive(saved.members||['我','旅伴B','旅伴C']);
  const expenses=reactive(saved.expenses||[]);
  const ex=reactive({title:'',amt:null,payer:0,part:[0,1,2]});
  const wx=reactive({});
  watch([stops,members,expenses],()=>{try{localStorage.setItem('ngy26b',JSON.stringify({stops,members,expenses}))}catch(e){}},{deep:true});
  onMounted(async()=>{try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.18&longitude=136.91&hourly=temperature_2m,weather_code&timezone=Asia%2FTokyo&start_date=2026-10-30&end_date=2026-11-03');
    const j=await r.json();j.hourly.time.forEach((t,i)=>{wx[t]={t:Math.round(j.hourly.temperature_2m[i]),c:j.hourly.weather_code[i]}});live.value=true;
  }catch(e){}});
  const date=computed(()=>days[sel.value].d);
  const list=computed(()=>(stops[date.value]||[]).slice().sort((a,b)=>a.t.localeCompare(b.t)));
  const mapped=computed(()=>list.value.filter(s=>s.q));
  const hr=t=>date.value+'T'+(t||'12').slice(0,2)+':00';
  const wxAt=t=>{const w=wx[hr(t)];return w?icon(w.c)+' '+w.t+'°':'~'+avg[date.value][1]+'°'};
  const dayWx=d=>{const v=Object.keys(wx).filter(k=>k.startsWith(d.d));if(!v.length)return '🌤 '+avg[d.d][0]+'–'+avg[d.d][1]+'°';const ts=v.map(k=>wx[k].t),m=wx[d.d+'T12:00'];return icon(m&&m.c)+' '+Math.min(...ts)+'–'+Math.max(...ts)+'°'};
  const HOTEL='2-10-12 Nishiki Naka-ku Nagoya';
  const nav=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.q);
  const route=computed(()=>{const m=mapped.value.slice(0,10);if(m.length<2)return '';const e=x=>encodeURIComponent(x.q);return 'https://www.google.com/maps/dir/?api=1&origin='+e(m[0])+'&destination='+e(m[m.length-1])+(m.length>2?'&waypoints='+m.slice(1,-1).map(e).join('%7C'):'')+'&travelmode=walking'});
  const openEdit=s=>{form.value=s?{...s}:{t:'09:00',n:'',q:'',d:''}};
  const save=()=>{const f=form.value;if(!f.n)return;const a=stops[date.value]||(stops[date.value]=[]);if(f.id){const i=a.findIndex(x=>x.id===f.id);a[i]={...f}}else a.push({...f,id:id()});form.value=null};
  const del=s=>{const a=stops[date.value];a.splice(a.findIndex(x=>x.id===s.id),1)};
  const rmMember=i=>{members.splice(i,1);expenses.splice(0,expenses.length,...expenses.filter(e=>e.payer!==i).map(e=>({...e,payer:e.payer>i?e.payer-1:e.payer,part:e.part.filter(p=>p!==i).map(p=>p>i?p-1:p)})).filter(e=>e.part.length));ex.payer=0;ex.part=members.map((_,k)=>k)};
  const addEx=()=>{if(!ex.title||!(ex.amt>0)||!ex.part.length)return;expenses.push({id:id(),title:ex.title,amt:Math.round(ex.amt),payer:ex.payer,part:[...ex.part]});ex.title='';ex.amt=null};
  const pay=computed(()=>{const b=members.map(()=>0);expenses.forEach(e=>{b[e.payer]+=e.amt;e.part.forEach(p=>b[p]-=e.amt/e.part.length)});
    const cr=[],db=[];b.forEach((v,i)=>{v=Math.round(v);if(v>0)cr.push({i,v});if(v<0)db.push({i,v:-v})});const out=[];
    while(cr.length&&db.length){const c=cr[0],d=db[0],a=Math.min(c.v,d.v);out.push({from:members[d.i],to:members[c.i],amt:a});c.v-=a;d.v-=a;if(!c.v)cr.shift();if(!d.v)db.shift()}return out});
  return{days,sel,tab,form,live,stops,members,expenses,ex,list,mapped,wxAt,dayWx,nav,route,openEdit,save,del,rmMember,addEx,pay}
}}).mount('#app');
</script>
</body>
</html>
